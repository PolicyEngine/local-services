name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version-file: pyproject.toml
        enable-cache: true

    - name: Run tests
      run: uv run --frozen pytest tests/ -v

  relock:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v8.1.0
      with:
        version-file: pyproject.toml

    - name: Relock
      run: uv lock --upgrade
