name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # The step in pr.yml before uv was pinned: with no version input, setup-uv
    # installs the newest uv release.
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true

    - name: Run tests
      run: uv run --frozen pytest tests/ -v

  relock:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # A step that writes the release itself, and another one than
    # .github/uv-version.txt's release.
    - uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.4"

    - name: Relock
      run: uv lock --upgrade
