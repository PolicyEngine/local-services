# Proof fixture for the file-length guard: Python files that are each
# one line over their limit. A committed file this long would break the rule
# itself, so the proof test writes each file, with this many lines, into a
# temporary directory and runs the file-length guard on that directory.

# Source code may have at most 800 lines, wherever it lives.
[[file]]
path = "projects/example/src/example/service.py"
lines = 801

[[file]]
path = "scripts/report.py"
lines = 801

# A test-like file name outside a test directory is still source code.
[[file]]
path = "projects/example/src/example/test_data.py"
lines = 801

# So is a module in a fixtures or tests directory inside a package, which
# ships in its wheel, and a conftest.py outside the test directories.
[[file]]
path = "packages/example/src/example/fixtures/sample.py"
lines = 801

[[file]]
path = "projects/example/src/example/tests/helpers.py"
lines = 801

[[file]]
path = "conftest.py"
lines = 801

# Test code may have at most 1,500 lines: files under the registry's test
# directories (here tests/), and the rules tool's own tests and fixtures.
[[file]]
path = "tests/test_service.py"
lines = 1501

[[file]]
path = "scripts/rules/tests/test_example.py"
lines = 1501
