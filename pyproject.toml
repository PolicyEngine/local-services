[project]
name = "microcosm-emitter"
version = "0.11.3"
description = "Local emitter process host with required build telemetry support"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "alembic>=1.13.3,<2",
    "sqlalchemy>=2,<3",
    "huggingface-hub>=0.20,<2",
    "psutil>=6,<8",
    "httpx>=0.27,<1",
    "microcosm-emitter-interface==0.11.3",
]

[project.urls]
Source = "https://github.com/PolicyEngine/microcosm-emitter"

[project.entry-points."microcosm.emitter.modules"]
telemetry = "microcosm_emitter.telemetry.service:create_module"
orrery = "microcosm_emitter.orrery.service:create_module"
huggingface = "microcosm_emitter.huggingface.service:create_module"

[project.scripts]
microcosm-emitter = "microcosm_emitter.cli:main"
microcosm-emitter-publish-graph = "microcosm_emitter.orrery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosm_emitter"]

# The rules tool, its registry and their documents are development tools of
# this repository; tools/check-installed.py refuses an archive holding them.
[tool.hatch.build.targets.sdist]
exclude = [
    "/scripts/rules",
    "/scripts/run_quality_guards.py",
    "/rules",
    "/docs/generated/rules.md",
    "/docs/engineering/skills/rules-registry.md",
]

# The one uv release, written only here: uv refuses to run this project with
# any other, and every setup-uv step reads it with version-file
# (rule emitter.dependencies.uv-version-pinned).
[tool.uv]
required-version = "==0.13.6"

[tool.uv.workspace]
members = ["packages/microcosm-emitter-interface"]

[tool.uv.sources]
microcosm-emitter-interface = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1,<2", "twine>=7,<8", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test doubles, such as the in-memory Hugging Face Hub.
pythonpath = ["tests/support"]
addopts = "-q --import-mode=importlib"
markers = ["collector: requires the pinned collector and disposable PostgreSQL"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
# Each rule ignored here is listed by emitter.quality.ruff-families-not-yet-fixed:
# as an exception, a rule that stays off, or in its baseline, a family not fixed yet.
ignore = [
    # They conflict with ruff format.
    "COM812",
    "ISC001",
    # They conflict with D211 and D212, which apply once the D family is fixed.
    "D203",
    "D213",
    # ruff format settles line length.
    "E501",
    # The rule families with findings not fixed yet. This list may only
    # shrink: fix a family, then remove it here and from the baseline
    # (rules/baselines/ruff-families-not-yet-fixed.txt, issue #54).
    "A",
    "ANN",
    "ARG",
    "BLE",
    "C4",
    "C90",
    "CPY",
    "D",
    "DTZ",
    "EM",
    "FBT",
    "INP",
    "ISC",
    "PERF",
    "PLC",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",
    "TC",
    "TRY",
]

[tool.ruff.lint.isort]
known-first-party = ["microcosm_emitter", "microcosm_emitter_interface"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = ""
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true
