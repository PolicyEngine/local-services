name: Update dependencies

# Relocks uv.lock with upgrades once a week and opens a pull request with the
# result, whose CI tests the upgraded versions (rule
# emitter.dependencies.scheduled-relock).
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: update-dependencies
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # uv lock may build a dependency's source archive to read its metadata,
  # running that dependency's code, so this job holds no token and stores no
  # credentials; it hands on only uv.lock.
  relock:
    name: Relock uv.lock
    if: github.repository == 'PolicyEngine/microcosm-emitter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - name: Relock with upgrades
        run: uv lock --upgrade
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relocked-uv-lock
          path: uv.lock
          if-no-files-found: error

  # Runs only git, gh and this repository's scripts, from a fresh checkout of
  # main, and creates the App token only once there is a relock to propose.
  propose:
    name: Propose the relock
    needs: relock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: relocked-uv-lock
          path: .
      - id: branch
        name: Start a relock branch from main
        run: bash tools/relock-prepare-branch.sh
      - id: commit
        name: Commit the relock
        run: bash tools/relock-commit.sh
      # The PolicyEngine GitHub App's token, unlike GITHUB_TOKEN, starts CI on
      # the pull request it opens. It may push branches, open pull requests,
      # and open the tracking issue when none is open; nothing else.
      - id: app-token
        if: steps.commit.outputs.changes_detected == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Push the branch and open the pull request
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash tools/relock-open-pull-request.sh
